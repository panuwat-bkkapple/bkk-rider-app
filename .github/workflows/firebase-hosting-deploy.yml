name: Deploy to Firebase (Hosting + Functions)

on:
  push:
    branches: [main]

# หนึ่ง deploy ต่อหนึ่งครั้ง ห้ามซ้อนกัน — รูปเดียวกับ bkk-system#675 เป๊ะ
# (workflow นั้นเป็นฝาแฝดของไฟล์นี้: hosting + functions สอง job ขนานกัน)
#
# เคสจริงที่นั่น 3 ก.ย. 2569 merge สองใบห่างกัน 33 วินาที เสียหายสองทาง —
# run ที่ถือต้นไม้เก่ากว่าจบทีหลังแล้วเขียน hosting ทับ (UI ของอีก PR ถูกย้อน
# ออกจาก production โดยไม่มี run ไหนแดง) และ run ที่ใหม่กว่าอ่านสถานะฝั่ง
# Firebase ตอนอีกตัวกำลังสร้างฟังก์ชันใหม่อยู่กลางทาง แล้วล้มด้วยข้อความที่
# อ่านเหมือนบั๊กของโค้ดที่เพิ่ง merge
#
# `cancel-in-progress: false` เป็นส่วนสำคัญของกฎ ไม่ใช่ค่าที่ปล่อยไว้ —
# `firebase deploy --only functions:rider-notifications` แก้ Cloud Run service
# ทีละตัว การฆ่ามันกลางทางคือการสร้างสภาพครึ่งๆ แบบข้อสองโดยตั้งใจ
concurrency:
  group: firebase-deploy-${{ github.ref }}
  cancel-in-progress: false

# Hosting and Functions are deployed by two INDEPENDENT jobs that run in
# parallel. Previously they were sequential steps in one job with Functions
# before Hosting and no continue-on-error, so any Functions failure (e.g. a
# Firebase auth error) aborted the job before Hosting ran and the rider PWA
# silently stopped deploying. Splitting them isolates the two deploys.
jobs:
  deploy-hosting:
    name: Deploy Hosting (rider PWA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build project
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
          channelId: live
          projectId: bkk-apple-tradein
          target: rider

  deploy-functions:
    name: Deploy Cloud Functions (rider-notifications)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: cd functions && npm ci

      - name: Build Functions
        run: cd functions && npm run build

      # Deploy via firebase-tools directly (pinned), authenticating with the
      # SAME service-account secret the Hosting job uses successfully, exposed
      # as Application Default Credentials. Replaces w9jds/firebase-action@master
      # whose moving @master tag broke auth ("Failed to authenticate") while the
      # pinned Hosting action kept working. Scoped to the rider-notifications
      # codebase so it cannot touch the bkk-system codebase's functions.
      - name: Deploy Firebase Functions
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/gcp_sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/gcp_sa.json"
          npx --yes firebase-tools@15.22.0 deploy \
            --only functions:rider-notifications \
            --project bkk-apple-tradein \
            --non-interactive
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BKK_APPLE_TRADEIN }}
