name: iOS build check

# ตรวจว่าเปลือก native ของ iOS ยัง build ผ่าน (ไม่ได้ deploy อะไรทั้งสิ้น)
#
# ไม่ผูกกับ push ทุกครั้งเพราะ runner macOS คิดนาทีแพงกว่า ubuntu ~10 เท่า
# และการ resolve SPM (firebase-ios-sdk) กินเวลาหลายนาที — รันเมื่อแตะ
# เปลือก native หรือกดเองเท่านั้น
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'src/native/**'
      - 'package.json'
      - '.github/workflows/ios-build-check.yml'

jobs:
  build:
    name: Build (iOS Simulator, unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_URL: ${{ secrets.VITE_FIREBASE_DATABASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

      - name: Sync Capacitor iOS project
        run: npx cap sync ios

      # GoogleService-Info.plist ไม่ได้ commit ไว้ (ดู docs/ios-app.md)
      # เก็บเป็น base64 ใน secret: base64 -i GoogleService-Info.plist | pbcopy
      - name: Restore GoogleService-Info.plist
        env:
          GOOGLE_SERVICE_INFO_PLIST_BASE64: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST_BASE64 }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST_BASE64" ]; then
            echo "::error::ไม่พบ secret GOOGLE_SERVICE_INFO_PLIST_BASE64 — ดูวิธีตั้งค่าใน docs/ios-app.md"
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST_BASE64" | base64 --decode > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist

      - name: Build for simulator (no code signing)
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO \
            build
