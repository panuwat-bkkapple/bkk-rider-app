name: CI

# repo นี้ไม่เคยมีด่านอัตโนมัติบน pull request มาก่อนเลย
#
# มีแค่ `firebase-hosting-deploy.yml` ที่รันตอน push เข้า main (คือ **หลัง**
# merge ไปแล้ว) กับ `preview-deploy.yml` ที่เป็น workflow_dispatch ต้องกดเอง
# ผลคือ PR ทุกใบขึ้น "ไม่มี check" ซึ่งอ่านง่ายว่าเป็นเขียว ทั้งที่ความจริงคือ
# **ไม่มีใครตรวจอะไรเลย** — ถ้า tsc พังหรือเทสแดง จะรู้ตอน deploy หลัง merge
# ซึ่งเป็น run ที่ไม่มีใครเปิดดู (ดูหัวข้อ "CI เขียว ไม่ได้แปลว่า deploy ขึ้น"
# ใน CLAUDE.md ของ bkk-frontend-next)
#
# รันบน pull_request เพราะ GitHub checkout **ผลลัพธ์หลัง merge** ไม่ใช่ปลาย
# branch ตัวเลขจากที่นี่จึงเป็นของต้นไม้ที่จะมีอยู่จริงหลัง merge เสมอ ซึ่งเป็น
# สิ่งที่การรันในเครื่องบนฐานเก่าสัญญาไม่ได้

# **ห้ามใส่ `branches:` กลับเข้ามาใต้ `pull_request`** — มันกรองที่ **base**
# ไม่ใช่ที่ branch ที่กำลังแก้ PR ที่ base ไม่ใช่ main (คือ PR ซ้อนชั้น ซึ่ง
# repo นี้ใช้เป็นปกติเวลาแตกงานเป็นใบเล็ก) จึงได้ **ศูนย์ check เงียบๆ**
# ซึ่งบนหน้า PR อ่านเหมือนเขียว — เป็นด่านว่างแบบเดียวกับที่ workflow นี้
# ตั้งใจมาปิดตั้งแต่แรก
#
# เกิดขึ้นจริงแล้วกับ #145 และ #146 (3 ก.ย. 2569): ทั้งสองใบเปิดโดยมี base เป็น
# branch ของใบก่อนหน้า **ไม่มี check รันสักครั้งเดียวตลอดอายุ PR** และไม่มี
# อะไรบอก ต้องไปยันด้วยการรัน tsc/เทส/build ในเครื่องแทน
#
# `types:` ต้องระบุเองเพราะค่าเริ่มต้นคือ [opened, synchronize, reopened]
# ซึ่ง **ไม่มี `edited`** และการย้าย base ของ PR นับเป็น `edited` — ไม่ใช่
# `synchronize` ผลคือ PR ที่ถูก retarget (เช่นตอนใบก่อนหน้า merge ไปแล้ว) จะ
# ถือ check ใบเก่าที่คำนวณจาก **base เดิม** ไว้ต่อ ซึ่งคือการรายงานผลของต้นไม้
# ที่ไม่ตรงกับต้นไม้ที่จะเกิดขึ้นจริงหลัง merge — อาการเดียวกับ "เทสผิดต้นไม้"
# ใน CLAUDE.md ต่างกันแค่ที่นี่หลอกเราด้วยเครื่องหมายถูกสีเขียว
#
# ต้นทุนที่ยอมจ่าย: `edited` ยิงตอนแก้หัวเรื่อง/คำอธิบาย PR ด้วย ไม่ได้แยกให้
# ยิงเฉพาะตอนย้าย base — จึงมี run ส่วนเกินบ้างเวลาแก้คำอธิบาย ที่ปริมาณ PR
# ของ repo นี้ถือว่าถูกกว่าการมีช่องให้ PR ผ่านไปโดยไม่มีใครตรวจ
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  rider-app:
    name: Rider app (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ตรงกับ node ที่ `firebase-hosting-deploy.yml` ใช้ build จริง
          # ด่านที่รันคนละเวอร์ชันกับตัว deploy คือด่านที่ทำนายผล deploy ไม่ได้
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # ADVISORY ไม่ใช่ด่าน — และนี่คือการตัดสินใจ ไม่ใช่ความหละหลวม
      #
      # ตอนต่อ toolchain กลับมา (`npm run lint` เคยรันไม่ได้เลยเพราะ eslint กับ
      # อีก 5 แพ็กเกจไม่อยู่ใน devDependencies) รอบแรกรายงาน **250 ปัญหา
      # (244 error)** ซึ่ง **221 ตัวเป็น `@typescript-eslint/no-explicit-any`**
      # กระจายทั่วแอปและมีมาก่อนทั้งหมด ไม่มีตัวไหนมาจากการแก้ที่กำลังทดสอบ
      #
      # ตั้งเป็นด่านตอนนี้ = แดงทุก PR ตั้งแต่วันแรก ซึ่งแย่กว่าไม่มีด่าน เพราะ
      # ด่านที่แดงตลอดสอนให้ทุกคน merge ผ่านสีแดง แล้ววันที่ type หรือเทสพังจริง
      # จะไม่มีใครมอง (เหตุผลและตัวเลขชุดเดียวกับที่ bkk-system บันทึกไว้ตอน
      # เจอ 1,109 ปัญหา — `eslint.config.js` ของสอง repo เหมือนกันเป๊ะ)
      #
      # ยังรันเพราะผลของมันมีค่าให้อ่าน และตัวเลขคือสิ่งที่ควรไล่ให้ลดลง
      # **เปลี่ยนเป็นด่านเมื่อถึงศูนย์ ไม่ใช่ก่อนหน้านั้น**
      #
      # ในนั้นมี 21 ตัวที่ไม่ใช่เรื่องสไตล์และควรดูแยกต่างหาก:
      # react-hooks/set-state-in-effect (8) · exhaustive-deps (8) · purity (3) ·
      # preserve-manual-memoization (1) · immutability (1)
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # `tsc -b` ไม่ใช่ `tsc --noEmit` — เป็นคำสั่งเดียวกับที่ `npm run build`
      # ใช้. --noEmit อ่าน tsconfig ตัว root ซึ่ง **ไม่ครอบ** `vite.config.ts`
      # กับไฟล์ฝั่ง node ตัวอื่น ส่วน -b build ทุก project ที่ถูก reference
      - name: Type check
        run: npx tsc -b

      # ─── ด่านข้ามรีโป ────────────────────────────────────────────────────
      # `src/utils/riderTransitions.test.ts` เทียบชื่อ event ที่ปุ่มของไรเดอร์
      # ยิง กับตาราง TRANSITIONS ใน `bkk-system/functions/status-engine.js`
      # ถ้าสองฝั่งหลุดกัน ไรเดอร์กดปุ่มแล้วโดน "unknown_event" กลับมา ทุกใบ
      # ทุกคน โดยไม่มีเทสฝั่งไหนแดงเพราะมันอยู่คนละ repo
      #
      # เทสตัวนั้น **skip ตัวเองเมื่อหา bkk-system ไม่เจอ** ซึ่งคือทุกครั้งที่
      # CI รัน (checkout มารีโปเดียว) ด่านจึงว่างมาตลอด — ขั้นนี้เอามาวางข้างกัน
      # ให้มันรันจริง เทสอ่านจาก `<workspace>/../bkk-system` (สามชั้นขึ้นจาก
      # src/utils) ซึ่ง actions/checkout เขียนออกนอก workspace ไม่ได้ จึงต้อง
      # checkout ลงในนี้ก่อนแล้ว mv ขึ้นไป
      #
      # sparse-checkout เอาเฉพาะไฟล์ที่เทสอ่านจริง ไม่ต้องลากทั้งรีโป
      #
      # **เคยหลุดมาแล้วเพราะคำเตือนตรงนี้เอง** (3 ก.ย. 2569): บรรทัดนี้เคยบอกให้
      # ตรวจด้วย `grep -rhoE '\.\./\.\./\.\./[a-z-]+/...' src/` ซึ่งจับได้เฉพาะ
      # path ที่เขียนเป็น literal `../../../bkk-system/...` แต่
      # `walletCategoryParity.test.ts` (มากับ #139) เขียนเป็น
      # `resolve(root, '../bkk-system/src/utils/transactionLogger.ts')`
      # **grep จึงมองไม่เห็น** ไฟล์ไม่ถูกเพิ่มเข้า sparse-checkout เทสก็เลย
      # `existsSync() === false` แล้ว `return` ผ่านไปเงียบๆ ทุกรอบ —
      # ด่านว่างมาตั้งแต่วันที่มันถูกเขียน โดย CI ขึ้นเขียวตลอด
      #
      # ตอนนี้ไม่ฝากไว้กับคอมเมนต์แล้ว ขั้น "ตรวจว่า sparse-checkout ครอบครบ"
      # ข้างล่างบังคับให้จริง — เพิ่มเทสที่อ่านไฟล์ใหม่ของ bkk-system แล้วลืม
      # เพิ่มที่นี่ = CI แดงพร้อมบอกชื่อไฟล์ ไม่ใช่ skip เงียบ
      - name: Checkout bkk-system (สำหรับด่านข้ามรีโป)
        id: sibling
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: panuwat-bkkapple/bkk-system
          path: bkk-system-src
          sparse-checkout: |
            functions/status-engine.js
            functions/status-transition-api.js
            src/utils/transactionLogger.ts
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # continue-on-error ข้างบนเป็นของจำเป็น ไม่ใช่ความหละหลวม: วันที่ bkk-system
      # ถูกเปลี่ยนเป็น private ขั้นนี้จะล้ม และ CI ของ repo นี้ต้องไม่แดงยกแผง
      # เพราะรีโปข้างๆ เปลี่ยน visibility
      #
      # แต่ห้ามให้มันกลับไปเงียบแบบเดิม — ถ้าวางไม่สำเร็จ ขั้นนี้เขียน warning
      # annotation + บรรทัดใน job summary ให้เห็นบนหน้า PR ว่าด่านนี้ไม่ได้รัน
      # (แก้ตอนนั้น = เพิ่ม PAT ที่อ่าน bkk-system ได้เป็น secret แล้วส่งเข้า
      # `token:` ของขั้นข้างบน)
      - name: วาง bkk-system ไว้ข้างกัน
        id: sibling_placed
        run: |
          missing=""
          for f in functions/status-engine.js functions/status-transition-api.js src/utils/transactionLogger.ts; do
            [ -f "bkk-system-src/$f" ] || missing="$missing $f"
          done
          if [ -z "$missing" ]; then
            mv bkk-system-src ../bkk-system
            echo "placed=true" >> "$GITHUB_OUTPUT"
            echo "ด่านข้ามรีโป: พร้อมรัน (เจอไฟล์ของ bkk-system ครบทุกตัว)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "placed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::ด่านข้ามรีโปไม่ได้รันครบ — checkout bkk-system outcome=${{ steps.sibling.outcome }} ไม่เจอ:$missing · เทสที่อ่านไฟล์นั้นจะ skip ตัวเอง สองฝั่งจึงไม่ถูกตรวจในรอบนี้"
            echo "ด่านข้ามรีโป: **ไม่ได้รันครบ** — ไม่เจอ:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ทำให้คำเตือนข้างบนเป็นด่านจริง ไม่ใช่คอมเมนต์ที่ไม่มีใครรัน
      #
      # ไล่หา path ของ bkk-system ที่เทสฝั่งนี้ **เปิดอ่านจริง** แล้วเช็คว่าอยู่ใน
      # sparse-checkout ครบไหม — จับทั้งรูป `../../../bkk-system/x` และ
      # `resolve(root, '../bkk-system/x')` เพราะเทียบจากคำว่า `bkk-system/`
      # เป็นต้นไป ไม่ใช่จากจำนวน `../` ข้างหน้า (ซึ่งคือจุดที่ grep เดิมพลาด)
      #
      # เอาเฉพาะที่อยู่ในเครื่องหมายคำพูด — คอมเมนต์ในโค้ดอ้างชื่อไฟล์ของ
      # bkk-system เต็มไปหมด (CLAUDE.md, functions/index.js, ฯลฯ) ถ้านับด้วยจะ
      # แดงเพราะ prose ไม่ใช่เพราะด่านว่าง
      #
      # ข้ามเมื่อวางไม่สำเร็จ: กรณีนั้นมี warning ของตัวเองอยู่แล้ว และการแดงซ้ำ
      # เพราะรีโปข้างๆ เป็น private คือสิ่งที่ continue-on-error ข้างบนกันไว้
      - name: ตรวจว่า sparse-checkout ครอบไฟล์ที่เทสอ้างครบ
        if: steps.sibling_placed.outputs.placed == 'true'
        run: |
          refs=$(grep -rhoE "['\"][^'\"]*bkk-system/[A-Za-z0-9/._-]+" src/ \
                 | grep -oE "bkk-system/[A-Za-z0-9/._-]+" \
                 | sed 's|^bkk-system/||' | sort -u)
          missing=""
          for f in $refs; do
            [ -f "../bkk-system/$f" ] || missing="$missing $f"
          done
          if [ -n "$missing" ]; then
            echo "::error::เทสใน src/ อ้างไฟล์ของ bkk-system ที่ไม่ได้อยู่ใน sparse-checkout:$missing — เพิ่มใน 'Checkout bkk-system' แล้วใน missing-check ของขั้นถัดมา ไม่งั้นเทสจะ skip ตัวเองเงียบๆ"
            exit 1
          fi
          echo "sparse-checkout ครอบไฟล์ที่เทสอ้างครบ: $(echo $refs | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: npm test

      # ซ้ำกับ tsc ข้างบนหนึ่งรอบโดยตั้งใจ (`build` = `tsc -b && vite build`)
      # เพราะขั้นบนแยกไว้ให้ชื่อขั้นที่แดงบอกได้ว่าพังเพราะ type หรือเพราะ vite
      #
      # ไม่ส่ง VITE_* เข้ามา: ตัว deploy ส่ง secret จริงเข้าไป แต่ vite แค่ inline
      # ค่าที่ไม่มีเป็น undefined ไม่ทำให้ build ล้ม — build ที่นี่จึงพิสูจน์ว่า
      # โค้ด compile และ bundle ได้ ไม่ได้พิสูจน์ว่า config ครบ (ซึ่งเป็นคนละเรื่อง
      # และตรวจที่นี่ไม่ได้อยู่แล้วเพราะ PR จาก fork อ่าน secret ไม่ได้)
      - name: Build
        run: npm run build

  functions:
    name: Cloud Functions (rider-notifications build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # เท่ากับ job deploy-functions ใน firebase-hosting-deploy.yml
          # หมายเหตุ: `functions/package.json` ประกาศ engines node 22 ซึ่งเป็น
          # เวอร์ชัน **runtime** บน Cloud Run ส่วนตัว build ทั้งที่นี่และที่ deploy
          # ใช้ 20 — ถ้าจะขยับ ต้องขยับพร้อมกันทั้งสองไฟล์ ไม่ใช่แค่ที่นี่
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      # `firebase deploy` compile ก่อนเป็นอย่างแรก — TS ที่ compile ไม่ผ่านทำให้
      # deploy ล้มทั้ง codebase ไม่ใช่แค่ function ที่พัง และตอนนี้เรารู้เรื่องนั้น
      # ก็ต่อเมื่อ merge ไปแล้ว
      - name: Build Functions
        run: npm run build --prefix functions
