name: CI

# แอปที่ไรเดอร์ใช้หน้างานจริง เป็น repo เดียวในสามที่ไม่เคยมีด่านก่อน merge
#
# ก่อนไฟล์นี้มีแค่สอง workflow: deploy ตอน push to main (คือ **หลัง** merge
# ไปแล้ว) กับ preview แบบ manual. ผลที่ตามมาสองข้อ ซึ่งไม่มีอะไรบนหน้า PR
# บอกให้รู้เลย:
#
#   1. เทส 110 ตัวใน src/utils/ ไม่เคยรันอัตโนมัติที่ไหน — รันเฉพาะตอนมีคน
#      นึกได้ว่าต้องรัน ซึ่งคือนิยามของด่านที่ไม่รู้ว่าตัวเองว่าง
#   2. type error กับ build error โผล่ครั้งแรกที่ **job deploy บน main** คือ
#      หลัง merge — PR ขึ้นเขียวเพราะไม่มีช่องให้แดง ไม่ใช่เพราะผ่านอะไร
#
# รันบน pull_request ซึ่ง GitHub checkout **ผลลัพธ์หลัง merge** ไม่ใช่ปลาย
# branch — ตัวเลขที่นี่จึงเป็นของต้นไม้ที่จะมีอยู่จริงหลัง merge แม้ฐานใน
# เครื่องคนเปิด PR จะเก่า (กฎเดียวกับที่ CLAUDE.md เขียนไว้เรื่องฐาน branch)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Rider app (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # `tsc -b` ไม่ใช่ `tsc --noEmit` — ตัวเดียวกับที่ `npm run build` เรียก
      # --noEmit ใช้ tsconfig ตัวราก ซึ่ง **ไม่รวม** vite.config.ts กับไฟล์ฝั่ง
      # node ตัวอื่น ส่วน -b build ทุก project ที่ถูก reference
      - name: Type check
        run: npx tsc -b

      - name: Test
        run: npm test

      # build อยู่ใน CI ด้วยทั้งที่ deploy ก็ build — เพราะ "deploy ก็ build"
      # แปลว่าที่แรกที่ bundler พังคือหลัง merge ไปแล้ว. ไม่ต้องใส่ VITE_* ใดๆ
      # (ยืนยันแล้วว่า build ผ่านโดยไม่มี env — ค่าพวกนั้นถูกอ่านตอน runtime)
      - name: Build
        run: npm run build

# ทำไมไม่มีขั้น Lint:
#
#   `npm run lint` = `eslint .` และ eslint.config.js import ห้าแพ็กเกจ
#   (@eslint/js, globals, eslint-plugin-react-hooks, eslint-plugin-react-refresh,
#   typescript-eslint) ที่ **ไม่มีอยู่ทั้งใน dependencies และ devDependencies**
#   — clone ใหม่แล้ว `npm ci` จึงรัน lint ไม่ได้เลย มันตายมาตั้งแต่ต้น ไม่ใช่
#   แค่เสีย
#
#   ใส่เข้ามาตอนนี้ = ด่านที่แดงทุก PR ตั้งแต่วันแรก ซึ่งแย่กว่าไม่มีด่าน
#   (ด่านที่แดงตลอดสอนให้ทุกคน merge ข้ามสีแดง แล้ววันที่ type หรือเทสพังจริง
#   จะไม่มีใครมอง — บทเรียนเดียวกับขั้น Lint (advisory) ใน bkk-system)
#
#   การเติม devDependencies ที่ขาดแล้วเปิด lint เป็น advisory เป็นงานแยก
