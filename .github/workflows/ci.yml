name: CI

# repo นี้ไม่เคยมีด่านอัตโนมัติบน pull request มาก่อนเลย
#
# มีแค่ `firebase-hosting-deploy.yml` ที่รันตอน push เข้า main (คือ **หลัง**
# merge ไปแล้ว) กับ `preview-deploy.yml` ที่เป็น workflow_dispatch ต้องกดเอง
# ผลคือ PR ทุกใบขึ้น "ไม่มี check" ซึ่งอ่านง่ายว่าเป็นเขียว ทั้งที่ความจริงคือ
# **ไม่มีใครตรวจอะไรเลย** — ถ้า tsc พังหรือเทสแดง จะรู้ตอน deploy หลัง merge
# ซึ่งเป็น run ที่ไม่มีใครเปิดดู (ดูหัวข้อ "CI เขียว ไม่ได้แปลว่า deploy ขึ้น"
# ใน CLAUDE.md ของ bkk-frontend-next)
#
# รันบน pull_request เพราะ GitHub checkout **ผลลัพธ์หลัง merge** ไม่ใช่ปลาย
# branch ตัวเลขจากที่นี่จึงเป็นของต้นไม้ที่จะมีอยู่จริงหลัง merge เสมอ ซึ่งเป็น
# สิ่งที่การรันในเครื่องบนฐานเก่าสัญญาไม่ได้

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rider-app:
    name: Rider app (types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # ตรงกับ node ที่ `firebase-hosting-deploy.yml` ใช้ build จริง
          # ด่านที่รันคนละเวอร์ชันกับตัว deploy คือด่านที่ทำนายผล deploy ไม่ได้
          node-version: 20
          cache: 'npm'
      - run: npm ci

      # ADVISORY ไม่ใช่ด่าน — และนี่คือการตัดสินใจ ไม่ใช่ความหละหลวม
      #
      # ตอนต่อ toolchain กลับมา (`npm run lint` เคยรันไม่ได้เลยเพราะ eslint กับ
      # อีก 5 แพ็กเกจไม่อยู่ใน devDependencies) รอบแรกรายงาน **250 ปัญหา
      # (244 error)** ซึ่ง **221 ตัวเป็น `@typescript-eslint/no-explicit-any`**
      # กระจายทั่วแอปและมีมาก่อนทั้งหมด ไม่มีตัวไหนมาจากการแก้ที่กำลังทดสอบ
      #
      # ตั้งเป็นด่านตอนนี้ = แดงทุก PR ตั้งแต่วันแรก ซึ่งแย่กว่าไม่มีด่าน เพราะ
      # ด่านที่แดงตลอดสอนให้ทุกคน merge ผ่านสีแดง แล้ววันที่ type หรือเทสพังจริง
      # จะไม่มีใครมอง (เหตุผลและตัวเลขชุดเดียวกับที่ bkk-system บันทึกไว้ตอน
      # เจอ 1,109 ปัญหา — `eslint.config.js` ของสอง repo เหมือนกันเป๊ะ)
      #
      # ยังรันเพราะผลของมันมีค่าให้อ่าน และตัวเลขคือสิ่งที่ควรไล่ให้ลดลง
      # **เปลี่ยนเป็นด่านเมื่อถึงศูนย์ ไม่ใช่ก่อนหน้านั้น**
      #
      # ในนั้นมี 21 ตัวที่ไม่ใช่เรื่องสไตล์และควรดูแยกต่างหาก:
      # react-hooks/set-state-in-effect (8) · exhaustive-deps (8) · purity (3) ·
      # preserve-manual-memoization (1) · immutability (1)
      - name: Lint (advisory)
        continue-on-error: true
        run: npm run lint

      # `tsc -b` ไม่ใช่ `tsc --noEmit` — เป็นคำสั่งเดียวกับที่ `npm run build`
      # ใช้. --noEmit อ่าน tsconfig ตัว root ซึ่ง **ไม่ครอบ** `vite.config.ts`
      # กับไฟล์ฝั่ง node ตัวอื่น ส่วน -b build ทุก project ที่ถูก reference
      - name: Type check
        run: npx tsc -b

      # ─── ด่านข้ามรีโป ────────────────────────────────────────────────────
      # `src/utils/riderTransitions.test.ts` เทียบชื่อ event ที่ปุ่มของไรเดอร์
      # ยิง กับตาราง TRANSITIONS ใน `bkk-system/functions/status-engine.js`
      # ถ้าสองฝั่งหลุดกัน ไรเดอร์กดปุ่มแล้วโดน "unknown_event" กลับมา ทุกใบ
      # ทุกคน โดยไม่มีเทสฝั่งไหนแดงเพราะมันอยู่คนละ repo
      #
      # เทสตัวนั้น **skip ตัวเองเมื่อหา bkk-system ไม่เจอ** ซึ่งคือทุกครั้งที่
      # CI รัน (checkout มารีโปเดียว) ด่านจึงว่างมาตลอด — ขั้นนี้เอามาวางข้างกัน
      # ให้มันรันจริง เทสอ่านจาก `<workspace>/../bkk-system` (สามชั้นขึ้นจาก
      # src/utils) ซึ่ง actions/checkout เขียนออกนอก workspace ไม่ได้ จึงต้อง
      # checkout ลงในนี้ก่อนแล้ว mv ขึ้นไป
      #
      # sparse-checkout เอาเฉพาะสองไฟล์ที่เทสอ่านจริง ไม่ต้องลากทั้งรีโป
      # (ตรวจด้วย `grep -rhoE '\.\./\.\./\.\./[a-z-]+/...' src/` — ถ้าเทสตัวใหม่
      #  อ้างไฟล์ที่สามของ bkk-system ต้องเพิ่มที่นี่ด้วย ไม่งั้นมันจะ skip เงียบ
      #  แบบเดียวกับที่ทั้งชุดนี้เคยเป็น)
      - name: Checkout bkk-system (สำหรับด่านข้ามรีโป)
        id: sibling
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: panuwat-bkkapple/bkk-system
          path: bkk-system-src
          sparse-checkout: |
            functions/status-engine.js
            functions/status-transition-api.js
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # continue-on-error ข้างบนเป็นของจำเป็น ไม่ใช่ความหละหลวม: วันที่ bkk-system
      # ถูกเปลี่ยนเป็น private ขั้นนี้จะล้ม และ CI ของ repo นี้ต้องไม่แดงยกแผง
      # เพราะรีโปข้างๆ เปลี่ยน visibility
      #
      # แต่ห้ามให้มันกลับไปเงียบแบบเดิม — ถ้าวางไม่สำเร็จ ขั้นนี้เขียน warning
      # annotation + บรรทัดใน job summary ให้เห็นบนหน้า PR ว่าด่านนี้ไม่ได้รัน
      # (แก้ตอนนั้น = เพิ่ม PAT ที่อ่าน bkk-system ได้เป็น secret แล้วส่งเข้า
      # `token:` ของขั้นข้างบน)
      - name: วาง bkk-system ไว้ข้างกัน
        run: |
          missing=""
          for f in functions/status-engine.js functions/status-transition-api.js; do
            [ -f "bkk-system-src/$f" ] || missing="$missing $f"
          done
          if [ -z "$missing" ]; then
            mv bkk-system-src ../bkk-system
            echo "ด่านข้ามรีโป: พร้อมรัน (เจอไฟล์ของ bkk-system ครบทั้งสอง)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::ด่านข้ามรีโปไม่ได้รันครบ — checkout bkk-system outcome=${{ steps.sibling.outcome }} ไม่เจอ:$missing · riderTransitions.test.ts จะ skip เทสที่อ่านไฟล์นั้น ชื่อ event สองฝั่งจึงไม่ถูกตรวจในรอบนี้"
            echo "ด่านข้ามรีโป: **ไม่ได้รันครบ** — ไม่เจอ:$missing" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Test
        run: npm test

      # ซ้ำกับ tsc ข้างบนหนึ่งรอบโดยตั้งใจ (`build` = `tsc -b && vite build`)
      # เพราะขั้นบนแยกไว้ให้ชื่อขั้นที่แดงบอกได้ว่าพังเพราะ type หรือเพราะ vite
      #
      # ไม่ส่ง VITE_* เข้ามา: ตัว deploy ส่ง secret จริงเข้าไป แต่ vite แค่ inline
      # ค่าที่ไม่มีเป็น undefined ไม่ทำให้ build ล้ม — build ที่นี่จึงพิสูจน์ว่า
      # โค้ด compile และ bundle ได้ ไม่ได้พิสูจน์ว่า config ครบ (ซึ่งเป็นคนละเรื่อง
      # และตรวจที่นี่ไม่ได้อยู่แล้วเพราะ PR จาก fork อ่าน secret ไม่ได้)
      - name: Build
        run: npm run build

  functions:
    name: Cloud Functions (rider-notifications build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # เท่ากับ job deploy-functions ใน firebase-hosting-deploy.yml
          # หมายเหตุ: `functions/package.json` ประกาศ engines node 22 ซึ่งเป็น
          # เวอร์ชัน **runtime** บน Cloud Run ส่วนตัว build ทั้งที่นี่และที่ deploy
          # ใช้ 20 — ถ้าจะขยับ ต้องขยับพร้อมกันทั้งสองไฟล์ ไม่ใช่แค่ที่นี่
          node-version: 20
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install Functions dependencies
        run: npm ci --prefix functions

      # `firebase deploy` compile ก่อนเป็นอย่างแรก — TS ที่ compile ไม่ผ่านทำให้
      # deploy ล้มทั้ง codebase ไม่ใช่แค่ function ที่พัง และตอนนี้เรารู้เรื่องนั้น
      # ก็ต่อเมื่อ merge ไปแล้ว
      - name: Build Functions
        run: npm run build --prefix functions
